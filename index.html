<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>PediAid Admin</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #1e3a5f; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>
  <iframe id="admin-frame" title="PediAid Admin Dashboard"></iframe>
  <script>
    // Set src via JS with a fresh cache-busting param on every load, so this
    // always fetches the live academics build instead of a cached copy of
    // the iframe document from a previous visit.
    document.getElementById('admin-frame').src =
      'https://academics.pediaid.bridgr.co.in/?p=academics%2Fadmin&_cb=' + Date.now();
  </script>
</body>
</html>
