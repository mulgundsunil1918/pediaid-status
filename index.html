<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>PediAid Admin — Moved</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --navy: #1e3a5f; --accent: #3182ce; --bg: #eef2f7; --text: #0f172a; --text-soft: #475569; --border: #e2e8f0; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    background:
      radial-gradient(1200px 400px at 80% -50px, rgba(49,130,206,0.10), transparent 60%),
      radial-gradient(900px 300px at 10% -80px, rgba(30,58,95,0.10), transparent 60%),
      var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    max-width: 460px;
    width: 100%;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 20px;
    box-shadow: 0 2px 4px rgba(15,23,42,0.06), 0 10px 28px rgba(15,23,42,0.10);
    padding: 40px 32px;
    text-align: center;
  }
  .icon {
    width: 56px; height: 56px;
    border-radius: 14px;
    background: var(--navy);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 20px;
    font-size: 26px;
  }
  h1 { font-size: 20px; font-weight: 800; margin: 0 0 10px; }
  p { color: var(--text-soft); font-size: 14px; line-height: 1.6; margin: 0 0 24px; }
  a.btn {
    display: inline-block;
    background: var(--navy);
    color: #fff;
    text-decoration: none;
    font-weight: 700;
    font-size: 14px;
    padding: 12px 24px;
    border-radius: 12px;
  }
  .note { margin-top: 18px; font-size: 12px; color: #94a3b8; }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">🩺</div>
    <h1>This page has moved</h1>
    <p>
      System status, content moderation, CME &amp; Never&nbsp;Again review,
      and broadcast notifications now all live in one place — the
      PediAid Academics admin dashboard. Redirecting you there now…
    </p>
    <a class="btn" href="https://academics.pediaid.bridgr.co.in/academics/login?next=%2Facademics%2Fadmin%2Fstatus">
      Go to the admin dashboard →
    </a>
    <div class="note">academics.pediaid.bridgr.co.in/academics/admin</div>
  </div>
  <script>
    setTimeout(function () {
      window.location.replace('https://academics.pediaid.bridgr.co.in/academics/login?next=%2Facademics%2Fadmin%2Fstatus');
    }, 2000);
  </script>
</body>
</html>
